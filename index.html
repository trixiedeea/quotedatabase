<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quote Bank</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="quoteBank-root">
  <div class="th-topbar">
    <div class="th-title-row">
      <div>
        <p class="th-title">Quote Bank</p>
        <p class="th-subtitle">Quote Archive</p>
      </div>
      <div class="th-count" id="th-count"></div>
    </div>
    <div class="th-tabs">
      <button class="th-tab-button" data-tab="add">Add Quote</button>
      <button class="th-tab-button" data-tab="search">Search</button>
      <button class="th-tab-button" data-tab="charts">Charts</button>
      <button class="th-tab-button" data-tab="design">Table Design</button>
    </div>
    <div class="th-syncbar" id="th-syncbar">
      <span id="th-sync-status">Checking Google Drive connection…</span>
      <span class="th-sync-actions" id="th-sync-actions"></span>
    </div>
  </div>
  <div class="th-content" id="th-content">
    <div class="th-loading">Loading archive…</div>
  </div>
</div>

<script>
(function(){
  const root = document.getElementById('quoteBank-root');
  const contentEl = document.getElementById('th-content');
  const countEl = document.getElementById('th-count');

  let schema = [];
  let quotes = [];
  let tab = 'add';
  let addValues = {};
  let editingId = null;
  let searchFilters = {};
  let searchExecuted = false;
  let toast = null;
  let pendingDeleteFieldId = null;
  let pendingDeleteQuoteId = null;
  let newFieldDraft = { label:'', type:'text', options:'', required:false };
  let openOptionsEditorFor = null;
  let openMultiselectKey = null;
  let chartField = null;
  let ready = false;

  function esc(v){
    return String(v==null?'':v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function uid(prefix){
    return prefix + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
  }

 
  function slugFieldId(label, existingIds){
    const base = String(label).trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '');
    let candidate = base || uid('f');
    let n = 2;
    while(existingIds.has(candidate)){
      candidate = base + '_' + n;
      n++;
    }
    existingIds.add(candidate);
    return candidate;
  }

  function defaultSchema(){
    const ids = new Set();
    const f = (label) => slugFieldId(label, ids);
    return [
      { id: f('Date'), label:'Date', type:'date', required:true },
      { id: f('Author'), label:'Author', type:'text', required:true },
      { id: f('Subject'), label:'Subject', type:'multiselect', required:true, options:
        [ 
          "Literacy",
          "Opportunity",
          "Curiosity",
          "Confidence",
          "Equity",
          "Imagination",
          "Leadership",
          "Child Development",
          "Book Access",
          "Impact",
          "Book Donation",
          "Identity",
          "Diversity",
          "Equality",
          "Engagement",
          "Native Culture",
          "Tribal Storytelling",
          "Cultural Preservation"
          ] },
      { id: f('Type'), label:'Type', type:'multiselect', required:true, options:
          [                
          "Testimonial",
          "Interview",
          "Observation",
          "Blog Post",
          "Survey Response",
          "Speech",
          "Report",
          "Media Interview",
          "Organizational Statement"
          ] },
      { id: f('Theme'), label:'Theme', type:'multiselect', required:true, options:
          [       
          "Literacy",
          "Leadership",
          "Reading",
          "Access",
          "Scale of Impact",
          "Books as Tools",
          "Access Equity",
          "Empowerment",
          "Family & Engagement",
          "Tradition",
          "Representation",
          "Education",
          "Nuture",
          "Community",
          "Resilience"
          ] },
      { id: f('Book Ecosystem'), label:'Book Ecosystem', type:'select', required:true, options:
          [
          "Kenya",
          "Ukraine",
          "Reading Nation Waterfall",
          "Nebraska",
          "New Mexico-Zuni Pueble",
          "California",
          "Book Ecosystems"
          ] },
      { id: f('Link to Source'), label:'Link to Source', type:'text', required:false },
      { id: f('Verified'), label:'Verified', type:'radio', required:true, options:['Yes','No'] },
      { id: f('Use Strategy'), label:'Use Strategy', type:'textarea', required:false },
      { id: f('Quote'), label:'Quote', type:'textarea', required:true }
    ];
  }

  // ---------- local persistence (PHP backend, data.json on disk) ----------
  async function loadAll(){
    try{
      const r = await fetch('api/data.php');
      const j = await r.json();
      schema = (Array.isArray(j.schema) && j.schema.length) ? j.schema : defaultSchema();
      quotes = Array.isArray(j.quotes) ? j.quotes : [];
    }catch(e){
      schema = defaultSchema();
      quotes = [];
    }
    ready = true;
    render();
    refreshDriveStatus();
  }

  async function persistToDisk(){
    const r = await fetch('api/save.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ schema, quotes })
    });
    const j = await r.json();
    if(!j || !j.ok) throw new Error(j && j.error ? j.error : 'save failed');
  }

  async function saveSchema(){
    try{
      await persistToDisk();
    }catch(e){
      toast = { type:'error', text:"Couldn't save the table design — try again." };
    }
    render();
  }

  async function saveQuotes(successMsg){
    try{
      await persistToDisk();
      if(successMsg) toast = { type:'success', text: successMsg };
    }catch(e){
      toast = { type:'error', text:"Couldn't save — check your connection and try again." };
    }
    render();
  }

  // ---------- Google Drive sync ----------
  // Sync now runs on a shared service account key (service_account.json),
  // not a per-person Google login, so there's nothing for a user to
  // "connect" — Pull/Push are always available. drive_status.php just
  // checks that the credentials on disk are actually working, so a broken
  // or missing key shows a clear message instead of a confusing failure.
  let driveConnected = false;
  let syncStatusMsg = '';
  let syncBusy = false;

  function renderSyncBar(){
    const statusEl = document.getElementById('th-sync-status');
    const actionsEl = document.getElementById('th-sync-actions');
    if(!statusEl || !actionsEl) return;
    if(syncBusy){
      statusEl.textContent = syncStatusMsg || 'Working…';
    } else if(!driveConnected){
      statusEl.textContent = syncStatusMsg || 'Google Drive sync unavailable — check service_account.json.';
    } else {
      statusEl.textContent = syncStatusMsg || 'Google Drive connected.';
    }
    actionsEl.innerHTML = '<button class="th-button th-button-small" data-action="drive-pull">Pull Latest</button> '
      + '<button class="th-button th-button-small" data-action="drive-push">Push My Changes</button>';
  }

  async function refreshDriveStatus(){
    try{
      const r = await fetch('api/drive_status.php');
      const j = await r.json();
      driveConnected = !!(j && j.connected);
      if(!driveConnected && j && j.error) syncStatusMsg = j.error;
    }catch(e){
      driveConnected = false;
    }
    renderSyncBar();
  }

  async function drivePull(){
    syncBusy = true; syncStatusMsg = 'Pulling latest from Google Drive…'; renderSyncBar();
    try{
      const r = await fetch('api/drive_pull.php', { method: 'POST' });
      const j = await r.json();
      if(!j.ok) throw new Error(j.error || 'Pull failed');
      schema = (Array.isArray(j.data.schema) && j.data.schema.length) ? j.data.schema : defaultSchema();
      quotes = Array.isArray(j.data.quotes) ? j.data.quotes : [];
      driveConnected = true;
      syncStatusMsg = 'Up to date as of ' + new Date().toLocaleTimeString() + '.';
      render();
    }catch(e){
      syncStatusMsg = 'Pull failed: ' + e.message;
    }
    syncBusy = false; renderSyncBar();
  }

  async function drivePush(){
    syncBusy = true; syncStatusMsg = 'Pushing your changes to Google Drive…'; renderSyncBar();
    try{
      const r = await fetch('api/drive_push.php', { method: 'POST' });
      const j = await r.json();
      if(!j.ok) throw new Error(j.error || 'Push failed');
      driveConnected = true;
      syncStatusMsg = 'Pushed to Google Drive at ' + new Date().toLocaleTimeString() + '.';
    }catch(e){
      syncStatusMsg = 'Push failed: ' + e.message;
    }
    syncBusy = false; renderSyncBar();
  }

  function fieldValueEmpty(field, v){
    if(field.type === 'multiselect') return !Array.isArray(v) || v.length === 0;
    return v == null || String(v).trim() === '';
  }

  // ---------- input renderers ----------
  function renderInput(field, value, context){
    const opts = field.options || [];
    if (field.type === "date") {
    return `<input type="date" id="${field.id}" value="${field.value || ''}">`;
    }
    if(field.type === 'text'){
      return `<input class="th-input" type="text" data-role="field-input" data-field-id="${field.id}" value="${esc(value||'')}">`;
    }
    if(field.type === 'textarea'){
      return `<textarea class="th-textarea" data-role="field-input" data-field-id="${field.id}">${esc(value||'')}</textarea>`;
    }
    if(field.type === 'select'){
      const blankLabel = context === 'search' ? 'Any' : 'Select…';
      return `<div class="th-select-wrap">
        <select class="th-select" data-role="field-input" data-field-id="${field.id}">
          <option value="">${blankLabel}</option>
          ${opts.map(o=>`<option value="${esc(o)}" ${value===o?'selected':''}>${esc(o)}</option>`).join('')}
        </select>
        <span class="th-select-caret">▼</span>
      </div>`;
    }

    if(field.type === 'radio'){
      let items = opts.map(o=>`<label class="th-radio-label"><input type="radio" name="radio_${field.id}" data-role="field-input" data-field-id="${field.id}" value="${esc(o)}" ${value===o?'checked':''}> ${esc(o)}</label>`).join('');
      if(context === 'search'){
        items += `<label class="th-radio-label"><input type="radio" name="radio_${field.id}" data-role="field-input" data-field-id="${field.id}" value="" ${!value?'checked':''}> Any</label>`;
      }
      return `<div class="th-radio-group">${items}</div>`;
    }
    if(field.type === 'multiselect'){ 
  const sel = Array.isArray(value) ? value : []; 
  const key = (context === 'search' ? 'search:' : 'add:') + field.id; 
  const open = openMultiselectKey === key; 
  const placeholder = context === 'search' ? 'Any' : 'Select…'; 
  const label = sel.length ? sel.join(', ') : placeholder; 

  if (open) {
    setTimeout(() => {
      const menu = document.querySelector(`[data-field-id="${field.id}"][data-action="toggle-multiselect"]`)?.nextElementSibling;
      if (menu && menu.classList.contains('th-ms-menu')) {
        
        if (window[`scroll_${key}`]) {
          menu.scrollTop = window[`scroll_${key}`];
        }
        
        menu.onscroll = () => { window[`scroll_${key}`] = menu.scrollTop; };
      }
    }, 0);
  }

  return `<div class="th-multiselect"> 
    <button type="button" class="th-ms-toggle ${sel.length ? '' : 'th-ms-empty'}" data-action="toggle-multiselect" data-field-id="${field.id}"> 
      <span class="th-ms-toggle-text">${esc(label)}</span> 
      <span class="th-ms-caret">${open ? '▲' : '▼'}</span> 
    </button> 
    ${open ? `<div class="th-ms-menu"> 
      ${opts.map(o=>`<label class="th-ms-option"> 
        <input type="checkbox" data-role="ms-option" data-field-id="${field.id}" value="${esc(o)}" ${sel.includes(o)?'checked':''}> 
        <span>${esc(o)}</span> 
      </label>`).join('')} 
    </div>` : ''} 
  </div>`; 
}

    return '';
  }

  // ---------- ADD / EDIT tab ----------
  function renderAddTab(){
    let msgHtml = '';
    if(toast){
      msgHtml = `<div class="th-msg th-msg-${toast.type}">${esc(toast.text)}</div>`;
    }
    const fieldsHtml = schema.map(f => `
      <div class="th-field">
        <label class="th-flabel">${esc(f.label)} ${f.required ? '<span class="th-req">*</span>':''}</label>
        ${renderInput(f, addValues[f.id], 'add')}
      </div>
    `).join('');

    return `
      <div class="th-card">
        <p class="th-section-label">${editingId ? 'Edit Quote' : 'New Entry'}</p>
        ${msgHtml}
        <form id="th-add-form">
          ${fieldsHtml}
          <div class="th-row">
            <button type="submit" class="th-button">${editingId ? 'Save Changes' : 'Add Quote'}</button>
            ${editingId ? '<button type="button" class="th-button" data-action="cancel-edit">Cancel</button>' : ''}
          </div>
        </form>
      </div>
    `;
  }

  // ---------- SEARCH tab ----------
  function matchQuote(q){
    for(const f of schema){
      const filterVal = searchFilters[f.id];
      const recVal = q.values ? q.values[f.id] : undefined;
      if(f.type === 'multiselect'){
        if(Array.isArray(filterVal) && filterVal.length > 0){
          const rv = Array.isArray(recVal) ? recVal : [];
          if(!filterVal.some(v => rv.includes(v))) return false;
        }
      } else {
        if(filterVal && String(filterVal).trim() !== ''){
          if(f.type === 'text' || f.type === 'textarea'){
            if(!String(recVal||'').toLowerCase().includes(String(filterVal).toLowerCase())) return false;
          } else {
            if(String(recVal||'') !== String(filterVal)) return false;
          }
        }
      }
    }
    return true;
  }

  function renderSearchTab(){
    const filterFieldsHtml = schema.map(f => `
      <div class="th-field">
        <label class="th-flabel">${esc(f.label)}</label>
        ${renderInput(f, searchFilters[f.id], 'search')}
      </div>
    `).join('');

    let resultsSection = '';

    if(!searchExecuted){
      resultsSection = `<div class="th-empty">Set your filters (or leave them blank to see everything) and click Search.</div>`;
    } else {
      const results = quotes.filter(matchQuote).slice().reverse();

      const fieldByLabel = (re) => schema.find(f => re.test(f.label));
      const bookEcoF   = fieldByLabel(/book ecosystem/i);
      const authorF    = fieldByLabel(/author/i);
      const quoteF     = fieldByLabel(/quote/i);
      const linkF      = fieldByLabel(/link/i);
      const useStratF  = fieldByLabel(/use strategy/i);
      const typeF      = fieldByLabel(/^type$/i);
      const subjectF   = fieldByLabel(/subject/i);
      const themeF     = fieldByLabel(/theme/i);
      const dateF      = fieldByLabel(/date/i);

      const valueOf = (f, q) => {
        if(!f || !q.values) return '';
        const v = q.values[f.id];
        if(fieldValueEmpty(f, v)) return '';
        return Array.isArray(v) ? v.join(', ') : v;
      };
      const row = (f, q) => {
        const v = valueOf(f, q);
        if(!v || !f) return '';
        return `<span class="small"><strong>${esc(f.label)}:</strong> ${esc(v)}</span><br>`;
      };
      const linkRow = (f, q) => {
        const v = valueOf(f, q);
        if(!v || !f) return '';
        const href = /^https?:\/\//i.test(v) ? v : `https://${v}`;
        return `<span class="small"><strong>${esc(f.label)}:</strong> <a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(v)}</a></span><br>`;
      };

      let resultsHtml = '';
      if(results.length === 0){
        resultsHtml = `<div class="th-empty" style="color:#e7e7e7;">No quotes match these filters.</div>`;
      } else {
        resultsHtml = results.map(q => {
          const quoteText = valueOf(quoteF, q);
          return `
            <div class="cardContainer">
              <div class="cardResults">
                ${row(bookEcoF, q)}
                ${row(authorF, q)}
                ${quoteText ? `<span class="large">"${esc(quoteText)}"</span>` : ''}
                <hr>
                ${linkRow(linkF, q)}
                ${row(useStratF, q)}
                ${row(typeF, q)}
                ${row(subjectF, q)}
                ${row(themeF, q)}
              </div>
              <div class="qb-card-actions">
                <button data-action="edit-quote" data-quote-id="${q.id}">Edit</button>
                ${pendingDeleteQuoteId === q.id
                  ? `<span class="th-confirm-inline">Delete this entry?
                      <button data-action="confirm-delete-quote" data-quote-id="${q.id}">Yes</button>
                      <button data-action="cancel-delete-quote">Cancel</button>
                     </span>`
                  : `<button data-action="delete-quote" data-quote-id="${q.id}">Delete</button>`
                }
              </div>
            </div>
          `;
        }).join('');
      }

      resultsSection = `
        <div class="qb-results-scope">
          <h1 id="qb-results-title">Search Results</h1>
          <p class="qb-results-count">${results.length} of ${quotes.length} quotes</p>
          ${resultsHtml}
        </div>
      `;
    }

    return `
      <div class="th-card" style="margin-bottom:20px;">
        <p class="th-section-label">Search Filters</p>
        <div id="th-search-fields">${filterFieldsHtml}</div>
        <div class="th-row">
          <button type="button" class="th-button" data-action="run-search">Search</button>
          <button type="button" class="th-button" data-action="clear-filters">Clear filters</button>
        </div>
      </div>
      ${resultsSection}
    `;
  }

  // ---------- CHARTS tab ----------
  function renderBarChart(rows){
    if(rows.length === 0){
      return `<div class="th-empty">No data yet for this field.</div>`;
    }
    const max = Math.max(...rows.map(r => r.count), 1);
    return `<div class="th-chart">` + rows.map(r => `
      <div class="th-chart-row">
        <div class="th-chart-label" title="${esc(r.label)}">${esc(r.label)}</div>
        <div class="th-chart-track"><div class="th-chart-bar" style="width:${Math.max(2, Math.round((r.count/max)*100))}%"></div></div>
        <div class="th-chart-count">${r.count}</div>
      </div>
    `).join('') + `</div>`;
  }

  function renderChartsTab(){
    const chartableFields = schema.filter(f => f.type !== 'textarea');
    const options = chartableFields.map(f => ({ id: f.id, label: f.label }));

    if(!chartField || !options.some(o => o.id === chartField)){
      chartField = options.length ? options[0].id : null;
    }

    const chipsHtml = options.map(o => `
      <button type="button" class="th-chip${o.id === chartField ? ' active' : ''}" data-action="pick-chart-field" data-field-id="${esc(o.id)}">${esc(o.label)}</button>
    `).join('');

    let bodyHtml = '';
    if(quotes.length === 0){
      bodyHtml = `<div class="th-empty">Add some quotes first, then come back here to chart them.</div>`;
    } else if(!chartField){
      bodyHtml = `<div class="th-empty">Add at least one field in Table Design to chart your data.</div>`;
    } else if(chartField === 'dateAdded'){
      const counts = {};
      quotes.forEach(q => {
        const d = q.dateAdded ? new Date(q.dateAdded) : null;
        const key = d && !isNaN(d) ? (d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0')) : 'Unknown';
        counts[key] = (counts[key] || 0) + 1;
      });
      const rows = Object.keys(counts).sort().map(k => ({ label: k, count: counts[k] }));
      bodyHtml = renderBarChart(rows);
    } else {
      const field = schema.find(f => f.id === chartField);
      const counts = {};
      quotes.forEach(q => {
        const v = q.values ? q.values[chartField] : undefined;
        if(field && field.type === 'multiselect'){
          (Array.isArray(v) ? v : []).forEach(val => {
            if(val) counts[val] = (counts[val] || 0) + 1;
          });
        } else if(v !== undefined && v !== null && String(v).trim() !== ''){
          counts[v] = (counts[v] || 0) + 1;
        }
      });
      const rows = Object.entries(counts)
        .map(([label, count]) => ({ label, count }))
        .sort((a, b) => b.count - a.count);
      bodyHtml = renderBarChart(rows);
    }

    return `
      <div class="th-card">
        <p class="th-section-label">Chart by field</p>
        <div class="th-chip-row">${chipsHtml}</div>
        ${bodyHtml}
      </div>
    `;
  }

  // ---------- DESIGN tab ----------
  function renderDesignTab(){
    let msgHtml = '';
    if(toast){
      msgHtml = `<div class="th-msg th-msg-${toast.type}">${esc(toast.text)}</div>`;
    }
    const rows = schema.map((f, i) => {
      const optionsbutton = ['select','multiselect','radio'].includes(f.type)
        ? `<button class="th-button-icon" data-action="toggle-options" data-field-id="${f.id}">Options</button>`
        : '';
      const optionsEditor = openOptionsEditorFor === f.id
        ? `<div class="th-options-editor">
            <label id="optionLabel">Options (one per line)</label>
            <textarea class="th-textarea" id="th-options-textarea" rows="4">${esc((f.options||[]).join('\\n'))}</textarea>
            <div class="th-row" style="margin-top:8px;">
              <button class="th-button th-button-small" data-action="save-options" data-field-id="${f.id}">Save options</button>
              <button class="th-button th-button-small" data-action="close-options">Close</button>
            </div>
          </div>`
        : '';
      const deleteControl = pendingDeleteFieldId === f.id
        ? `<span class="th-confirm-inline">Delete field?
            <button class="th-button th-button-danger th-button-small" data-action="confirm-delete-field" data-field-id="${f.id}">Yes</button>
            <button class="th-button th-button-small" data-action="cancel-delete-field">Cancel</button>
           </span>`
        : `<button class="th-button-icon" data-action="delete-field" data-field-id="${f.id}">Delete</button>`;

      return `
        <div class="th-field-row">
          <input class="th-field-name-input" data-action="rename-field" data-field-id="${f.id}" value="${esc(f.label)}">
          <span class="th-badge">${esc(f.type)}</span>
          <label style="font-size:12px; color:var(--ink-soft); display:flex; align-items:center; gap:4px;">
            <input type="checkbox" data-action="toggle-required" data-field-id="${f.id}" ${f.required?'checked':''}> Required
          </label>
          <button class="th-button-icon" data-action="move-field" data-dir="up" data-field-id="${f.id}" ${i===0?'disabled':''}>↑</button>
          <button class="th-button-icon" data-action="move-field" data-dir="down" data-field-id="${f.id}" ${i===schema.length-1?'disabled':''}>↓</button>
          ${optionsbutton}
          ${deleteControl}
          ${optionsEditor}
        </div>
      `;
    }).join('');

    const showOptionsInput = ['select','multiselect','radio'].includes(newFieldDraft.type);

    return `
      <div class="th-card">
        <p class="th-section-label">Fields</p>
        ${msgHtml}
        ${rows}
        <div class="th-newfield-form">
          <p class="th-section-label" style="border-bottom:none;">Add a Field</p>
          <div class="th-field">
            <label class="th-flabel">Label</label>
            <input class="th-input" id="th-newfield-label" type="text" value="${esc(newFieldDraft.label)}" placeholder="e.g. Page Number">
          </div>
          <div class="th-field">
            <label class="th-flabel">Type</label>
            <div class="th-select-wrap">
              <select class="th-select" id="th-newfield-type">
                <option value="text" ${newFieldDraft.type==='text'?'selected':''}>Short text</option>
                <option value="textarea" ${newFieldDraft.type==='textarea'?'selected':''}>Long text</option>
                <option value="select" ${newFieldDraft.type==='select'?'selected':''}>Dropdown (pick one)</option>
                <option value="multiselect" ${newFieldDraft.type==='multiselect'?'selected':''}>Multi-select (pick many)</option>
                <option value="radio" ${newFieldDraft.type==='radio'?'selected':''}>Radio (pick one)</option>
                <option value="date" ${newFieldDraft.type==='date'?'selected':''}>Date</option>
              </select>
              <span class="th-select-caret">▼</span>
            </div>
          ${showOptionsInput ? `
          <div class="th-field">
            <label id="optionLabel">Options (one per line)</label>
            <textarea class="th-textarea" id="th-newfield-options" rows="3">${esc(newFieldDraft.options)}</textarea>
          </div>` : ''}
          <div class="th-field">
            <label style="font-size:13px; display:flex; align-items:center; gap:6px;">
              <input type="checkbox" id="th-newfield-required" ${newFieldDraft.required?'checked':''}> Required
            </label>
          </div>
          <button class="th-button" data-action="add-field">Add field</button>
          <p class="th-note">Deleting a field only removes it from new entries and forms — it doesn't delete data already saved on existing quotes.</p>
        </div>
      </div>
    `;
  }

  function render(){
    if(!ready){
      contentEl.innerHTML = `<div class="th-loading">Loading archive…</div>`;
      return;
    }
    countEl.textContent = quotes.length + (quotes.length === 1 ? ' quote' : ' quotes');
    root.querySelectorAll('.th-tab-button').forEach(button => {
      button.classList.toggle('active', button.dataset.tab === tab);
    });
    if(tab === 'add') contentEl.innerHTML = renderAddTab();
    else if(tab === 'search') contentEl.innerHTML = renderSearchTab();
    else if(tab === 'charts') contentEl.innerHTML = renderChartsTab();
    else contentEl.innerHTML = renderDesignTab();

    // autofocus options editor textarea cursor to end if open
    if(tab === 'design' && openOptionsEditorFor){
      const ta = document.getElementById('th-options-textarea');
      if(ta) ta.focus();
    }
  }

  // ---------- event delegation ----------
  root.addEventListener('click', function(e){
    const tabbutton = e.target.closest('.th-tab-button');
    if(tabbutton){
      tab = tabbutton.dataset.tab;
      toast = null;
      pendingDeleteFieldId = null;
      pendingDeleteQuoteId = null;
      openOptionsEditorFor = null;
      openMultiselectKey = null;
      render();
      return;
    }

    const actionEl = e.target.closest('[data-action]');
    if(!actionEl) return;
    const action = actionEl.dataset.action;

    if(action === 'drive-pull'){ drivePull(); return; }
    if(action === 'drive-push'){ drivePush(); return; }
    if(action === 'pick-chart-field'){ chartField = actionEl.dataset.fieldId; render(); return; }

    if(action === 'cancel-edit'){
      editingId = null; addValues = {}; toast = null; openMultiselectKey = null; render(); return;
    }
    if(action === 'clear-filters'){
      searchFilters = {}; openMultiselectKey = null; searchExecuted = false; render(); return;
    }
    if(action === 'run-search'){
      searchExecuted = true; render(); return;
    }
    if(action === 'edit-quote'){
      const id = actionEl.dataset.quoteId;
      const q = quotes.find(q => q.id === id);
      if(q){
        editingId = id;
        addValues = JSON.parse(JSON.stringify(q.values || {}));
        tab = 'add';
        toast = null;
        render();
      }
      return;
    }
    if(action === 'delete-quote'){
      pendingDeleteQuoteId = actionEl.dataset.quoteId; render(); return;
    }
    if(action === 'cancel-delete-quote'){
      pendingDeleteQuoteId = null; render(); return;
    }
    if(action === 'confirm-delete-quote'){
      const id = actionEl.dataset.quoteId;
      quotes = quotes.filter(q => q.id !== id);
      pendingDeleteQuoteId = null;
      saveQuotes('Quote deleted.');
      return;
    }
    if(action === 'toggle-multiselect'){
      const fid = actionEl.dataset.fieldId;
      const isSearch = actionEl.closest('#th-search-fields') !== null;
      const key = (isSearch ? 'search:' : 'add:') + fid;
      openMultiselectKey = openMultiselectKey === key ? null : key;
      render();
      return;
    }
    if(action === 'toggle-options'){
      const fid = actionEl.dataset.fieldId;
      openOptionsEditorFor = openOptionsEditorFor === fid ? null : fid;
      render(); return;
    }
    if(action === 'close-options'){
      openOptionsEditorFor = null; render(); return;
    }
    if(action === 'save-options'){
      const fid = actionEl.dataset.fieldId;
      const ta = document.getElementById('th-options-textarea');
      const opts = ta.value.split('\n').map(s=>s.trim()).filter(Boolean);
      const f = schema.find(f=>f.id===fid);
      if(f) f.options = opts;
      openOptionsEditorFor = null;
      saveSchema();
      return;
    }
    if(action === 'move-field'){
      const fid = actionEl.dataset.fieldId;
      const dir = actionEl.dataset.dir;
      const i = schema.findIndex(f=>f.id===fid);
      const swapWith = dir === 'up' ? i-1 : i+1;
      if(swapWith >= 0 && swapWith < schema.length){
        const tmp = schema[i]; schema[i] = schema[swapWith]; schema[swapWith] = tmp;
        saveSchema();
      }
      return;
    }
    if(action === 'delete-field'){
      pendingDeleteFieldId = actionEl.dataset.fieldId; render(); return;
    }
    if(action === 'cancel-delete-field'){
      pendingDeleteFieldId = null; render(); return;
    }
    if(action === 'confirm-delete-field'){
      const fid = actionEl.dataset.fieldId;
      schema = schema.filter(f => f.id !== fid);
      pendingDeleteFieldId = null;
      saveSchema();
      return;
    }
    if(action === 'add-field'){
      const label = document.getElementById('th-newfield-label').value.trim();
      const type = document.getElementById('th-newfield-type').value;
      const needsOptions = ['select','multiselect','radio'].includes(type);
      let options = [];
      if(needsOptions){
        const raw = document.getElementById('th-newfield-options').value;
        options = raw.split('\n').map(s=>s.trim()).filter(Boolean);
      }
      const required = document.getElementById('th-newfield-required').checked;
      if(!label){
        toast = { type:'error', text:'Give the new field a label first.' };
        render(); return;
      }
      if(needsOptions && options.length === 0){
        toast = { type:'error', text:'Add at least one option for this field type.' };
        render(); return;
      }
      const newField = { id: slugFieldId(label, new Set(schema.map(f => f.id))), label, type, required };
      if(needsOptions) newField.options = options;
      schema.push(newField);
      newFieldDraft = { label:'', type:'text', options:'', required:false };
      toast = null;
      saveSchema();
      return;
    }
  });

  root.addEventListener('input', function(e){
    const t = e.target;
    if(t.dataset.role === 'field-input' && t.tagName !== 'SELECT' && t.type !== 'radio'){
      const isSearch = t.closest('#th-search-fields') !== null;
      const store = isSearch ? searchFilters : addValues;
      store[t.dataset.fieldId] = t.value;
    }
    if(t.dataset.action === 'rename-field'){
      const f = schema.find(f=>f.id===t.dataset.fieldId);
      if(f) f.label = t.value;
    }
  });

  root.addEventListener('change', function(e){
    const t = e.target;
    if(t.dataset.role === 'field-input' && (t.tagName === 'SELECT' || t.type === 'radio')){
      const isSearch = t.closest('#th-search-fields') !== null;
      const store = isSearch ? searchFilters : addValues;
      store[t.dataset.fieldId] = t.value;
      if(isSearch){ searchExecuted = false; render(); }
    }
    if(t.dataset.role === 'ms-option'){
      const fid = t.dataset.fieldId;
      const isSearch = t.closest('#th-search-fields') !== null;
      const store = isSearch ? searchFilters : addValues;
      const arr = Array.isArray(store[fid]) ? store[fid].slice() : [];
      const idx = arr.indexOf(t.value);
      if(t.checked){ if(idx === -1) arr.push(t.value); }
      else { if(idx !== -1) arr.splice(idx,1); }
      store[fid] = arr;
      if(isSearch) searchExecuted = false;
      render();
    }
    if(t.dataset.action === 'toggle-required'){
      const f = schema.find(f=>f.id===t.dataset.fieldId);
      if(f){ f.required = t.checked; saveSchema(); }
    }
    if(t.id === 'th-newfield-type'){
      newFieldDraft.type = t.value;
      render();
    }
  });

  root.addEventListener('blur', function(e){
    if(e.target.dataset.action === 'rename-field'){
      saveSchema();
    }
  }, true);

  document.addEventListener('click', function(e){
    if(!openMultiselectKey) return;
    if(!e.target.closest('.th-multiselect') && !e.target.closest('[data-action="toggle-multiselect"]')){
      openMultiselectKey = null;
      render();
    }
  });

  root.addEventListener('submit', function(e){
    if(e.target.id === 'th-add-form'){
      e.preventDefault();
      const missing = schema.filter(f => f.required && fieldValueEmpty(f, addValues[f.id]));
      if(missing.length > 0){
        toast = { type:'error', text: 'Please fill in: ' + missing.map(f=>f.label).join(', ') };
        render();
        return;
      }
      if(editingId){
        const q = quotes.find(q=>q.id===editingId);
        if(q) q.values = JSON.parse(JSON.stringify(addValues));
        editingId = null;
        addValues = {};
        saveQuotes('Quote updated.');
      } else {
        quotes.push({ id: uid('q'), dateAdded: new Date().toISOString(), values: JSON.parse(JSON.stringify(addValues)) });
        addValues = {};
        saveQuotes('Quote added to the archive.');
      }
    }
  });

  loadAll();
})();
</script>
</body>
</html>
